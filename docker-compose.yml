# Este archivo solo se usa en la Ruta A (MySQL en Docker).
# En la Ruta B (MySQL instalado en Windows) no hace falta.

# Version de la sintaxis de Docker Compose
version: '3.8'

# Definicion de servicios/contenedores del proyecto
services:
  mysql:
    # Imagen oficial de MySQL en su version 8.0
    image: mysql:8.0
    # Se reinicia automaticamente si falla, a menos que lo paremos nosotros
    restart: unless-stopped
    # Variables de entorno para la contrasena de root y el nombre de la BD
    # La contrasena de root se lee de DB_PASS en el .env de la raiz (el usuario es root)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Falta DB_PASS en el archivo .env}
      MYSQL_DATABASE: biblioteca
    # Mapeamos el puerto 3306 de nuestro equipo con el 3306 del contenedor
    ports:
      - "3306:3306"
    # Volumenes: datos persistentes y script SQL de la base de datos
    # init.sql solo se ejecuta la primera vez que se crea el volumen mysql_data.
    # Para cambiar la contrasena o volver a los datos iniciales: docker compose down -v
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

# Volumen con nombre para mantener los datos de la BD aunque paremos el contenedor
volumes:
  mysql_data:
